# Change prefix from Ctrl+b to Ctrl+a (like screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload this config. Capital R (Shift-r): plain 'r' stays tmux's built-in
# refresh-client, and 'C-r' is the rainbow palette binding -- both distinct keys.
# NB source-file is additive: it re-applies settings but does not undo removed
# lines or reset styles a running animator loop is painting.
bind R source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Was "screen", an 8-colour terminfo entry -- tmux quantizes RGB down to 8
# colours with it, which makes the animated pane border (see ANIMATED PANE
# BORDER at the bottom of this file) banded instead of a smooth gradient.
# tmux-256color + the RGB terminal-feature override gives true 24-bit colour.
# These two lines are a prerequisite for that animation looking right.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
# status-bg/status-fg are deprecated ALIASES for status-style -- setting either
# rewrites the same underlying value, so they cannot coexist with status-style.
# Written as one status-style here because the animator overwrites it per frame
# and restores this exact value on stop; keep RESTORE_STATUS in
# ~/.local/bin/tmux-pulse-border in sync with it.
set -g status-style "bg=green,fg=black"
# Distinguish the SELECTED window in the status bar. Uses reverse/dim rather
# than fixed colours on purpose: when the status animator (see ANIMATED TMUX UI)
# has the "status" target on, the bar background cycles through every hue, so any
# fixed accent would occasionally match the bar and vanish. reverse always
# inverts against whatever the bar is that frame, so the current window stays
# legible; dim pushes the inactive windows back.
set -g window-status-current-style "reverse,bold"
set -g window-status-style "dim"
set-option -g status-position top


set -g pane-border-status top
set -g pane-border-format " #P: #{pane_title} "
# Borders are ALWAYS exactly one cell wide -- tmux has no thickness option and
# cannot have one (the border lives in the single row/column between panes).
# "heavy" uses thick box-drawing glyphs, which is the only built-in way to make
# that one cell read as a wider line.
set -g pane-border-lines heavy
# NOTE: the animator (see ANIMATED TMUX UI below) overwrites this at runtime and
# restores this exact value on `stop`. Change it here, change RESTORE_BORDER in
# ~/.local/bin/tmux-pulse-border too.
set -g pane-active-border-style fg=magenta
set -g pane-border-style fg=colour238
# 1. Set a pane title: Ctrl-b : then select-pane -T "My Label"
# - Use bottom instead of top to show labels at pane bottom
# - Toggle border status: Ctrl-b : then set pane-border-status
# - #P shows pane number, #{pane_title} shows your custom label

# re-number on close.
set -g renumber-windows on

# ============================================================================
# ANIMATED TMUX UI (pulsing multicolour "LED" on borders, status bar, etc.)
# Added 2026-07-26. Script: ~/.local/bin/tmux-pulse-border
# ============================================================================
#
# WHAT IT IS
#   Parts of the tmux chrome continuously rotate through the colour wheel while
#   brightness breathes in and out, like a pulsing RGB LED. Any tmux option that
#   takes a style can be driven this way -- see TARGETS.
#
# HOW IT WORKS / WHY IT'S AN EXTERNAL SCRIPT
#   tmux has no animation timer or interpolation of any kind -- a style is a
#   static value until something changes it. So the animation is driven from
#   outside: the script spawns a detached background loop that re-sets the
#   relevant style options once per frame. One full colour cycle is precomputed
#   at startup (awk does the HSV->RGB conversion) into a table of ready-to-run
#   tmux argument strings, so a frame costs one exec and no maths. Hue advances
#   linearly; brightness is a separate sine wave. The hue and pulse periods are
#   intentionally a non-integer ratio so the bright peak drifts across different
#   colours rather than always peaking on the same one.
#   All targets for a frame are sent as ONE batched `tmux a \; b \; c` call --
#   which is why adding targets is nearly free (see COST).
#
# TARGETS -- what can be animated (--targets, default border,status)
#   border   pane-active-border-style. NB tmux draws borders only BETWEEN panes;
#            an edge flush against the window edge has no cell to colour, so a
#            single unsplit pane shows no border at all (only the
#            pane-border-status title row, which is a real reserved row).
#   status   status-style. Always present and full width, so this is the most
#            reliable target. Uses a DIMMED (42%) fill of the palette colour --
#            a full-brightness bar is exhausting to sit under -- with black or
#            white text chosen per frame by relative luminance so it stays
#            readable as the hue moves. The dim fill gets its own contrast
#            decision, since dimming a bright yellow makes it dark.
#   window   window-status-current-style. Just the active window's entry in the
#            bar; a subtle accent that leaves the rest of the bar alone. Good
#            paired with a static status bar.
#   message  message-style, i.e. the command prompt / message line.
#   To add another: write paint_<name>() and restore_<name>() in the script and
#   add the name to the validation case. Everything else is generic.
#
# CONTROLS -- all with Ctrl held down, e.g. C-a C-r
#   prefix+P     toggle the animation on/off   (capital P, no Ctrl)
#   prefix+C-r   rainbow      prefix+C-c   cool
#   prefix+C-w   warm         prefix+C-n   neon
#   prefix+C-b   border only     prefix+C-s   border+status (the default)
#   prefix+C-e   everything: border,status,window,message
#   (C-e, not C-a -- prefix+C-a is send-prefix and must stay that way.)
#   (C-o was NOT used for cool -- it is tmux's built-in rotate-window. Check
#   `tmux list-keys -T prefix` before claiming any new binding.)
#
#   tmux-pulse-border {start|stop|toggle|set|status|palettes|targets}
#     -p, --palette NAME  rainbow | cool | warm | neon
#     -t, --targets LIST  comma-separated, see TARGETS above
#         --fps N         frames per second      (default 12, autostart uses 8)
#         --hue-secs N    seconds per colour cycle   } override the palette's
#         --pulse-secs N  seconds per breath         } own tuned defaults
#         --sat N         0..1 saturation            }
#   `set` = stop+start, i.e. how you switch palette or targets live. `status`
#   reports the running palette AND targets. `stop` restores the static values
#   set above -- it reads the targets it was actually animating out of the
#   statefile, so it cannot leave a target frozen mid-cycle.
#
# PALETTES -- each one tunes hue arc, saturation, brightness range AND speed
#   rainbow  full 360 wheel, medium speed. The original.
#   cool     cyan -> azure -> blue -> violet. Slow 14s drift, deep 5s breath,
#            dims to 0.28. Calm; good for background/idle sessions.
#   warm     crimson -> red -> orange -> amber, like a coal. 11s / 4s breath.
#   neon     full wheel, saturation 1.0, brightness floor 0.72 so it never
#            really goes dark, fast 5s hue + 0.7s flicker. Electric-sign look.
#            Autostarted at 10fps rather than 8 -- the fast pulse needs the
#            extra frames or the flicker looks steppy.
#
#   Partial arcs (cool, warm) use HUE_MODE=pingpong: they ease out to the far
#   end and back with a cosine, because a partial arc that just resets to the
#   start would snap visibly at the seam. Full-wheel palettes use sweep, which
#   is seamless because 360 wraps onto 0.
#   GOTCHA when adding a palette: a hue arc must run FORWARD numerically. warm
#   is 350->405, not 350->45; the latter interpolates the long way and detours
#   through blue and green. Values above 360 are wrapped by the maths.
#
# COST -- this is a busy loop, that is the tradeoff
#   Measured on this machine: 12fps put the tmux SERVER at ~6.6% CPU (every
#   frame is a global set, so the repaint is server-wide); 8fps roughly halves
#   that for a nearly identical look, which is why autostart uses 8. The loop
#   process itself is ~0.7%. If the server ever seems to be working too hard,
#   lower --fps or just hit prefix+P.
#   Cost scales with FPS, not target count: 2 targets @8fps = 5.0% server CPU,
#   all 4 targets @8fps = 5.2%, because a frame is one batched tmux call.
#   So animating more of the UI is cheap; animating it faster is not.
#
# PORTING TO ANOTHER MACHINE -- required, easy to forget
#   1. Copy ~/.local/bin/tmux-pulse-border and `chmod +x` it. It is NOT on PATH
#      here, which is why every reference in this file is a full path.
#   2. Keep the default-terminal / terminal-features lines near the top of this
#      file, and confirm the terminal actually does truecolour:
#        tmux display -p '#{client_termfeatures}'   # expect RGB in the list
#      Without RGB the gradient collapses into a few banded colours.
#   3. The script is written for bash 3.2 (what macOS ships) -- no mapfile, it
#      reads the palette with a while-read loop. Safe on newer bash too.
#   4. Needs tmux >= 3.2 or so for `terminal-features`. Built against 3.6a.
#   5. Pidfile and statefile live in $TMPDIR. If the tmux server is killed
#      outright, the loop notices via a periodic has-session check and exits
#      within ~5s.
#   6. The RESTORE_* values in the script must match the static styles set in
#      this file (pane-active-border-style, status-style, ...). If you restyle
#      tmux and skip this, `stop` will snap the UI to the old colours.
#
# TWO QUOTING TRAPS, both of which silently half-work -- do not "clean up"
#   a. Targets are joined with an ESCAPED `\;`. A bare `;` gets eaten by the
#      shell in the eval and every target after the first is silently dropped.
#   b. The frame generator is a single-quoted awk program, so its comments must
#      contain NO apostrophes -- one contraction ends the quote early and the
#      script dies with a syntax error a hundred lines away.
#
# To stop autostarting, comment out the run-shell line; the bindings still work.
bind P run-shell -b "~/.local/bin/tmux-pulse-border toggle"
# palette switching: prefix+C-<key>. Palette changes keep the current targets.
bind C-r run-shell -b "~/.local/bin/tmux-pulse-border set -p rainbow --fps 8"
bind C-c run-shell -b "~/.local/bin/tmux-pulse-border set -p cool --fps 8"
bind C-w run-shell -b "~/.local/bin/tmux-pulse-border set -p warm --fps 8"
bind C-n run-shell -b "~/.local/bin/tmux-pulse-border set -p neon --fps 10"
# how much of the UI to animate
bind C-b run-shell -b "~/.local/bin/tmux-pulse-border set -t border --fps 8"
bind C-s run-shell -b "~/.local/bin/tmux-pulse-border set -t border,status --fps 8"
# C-e for "everything" -- NOT C-a, which is send-prefix (literal Ctrl-A to
# nested apps); rebinding it would break that.
bind C-e run-shell -b "~/.local/bin/tmux-pulse-border set -t border,status,window,message --fps 8"
# Autostart animates the BORDER only, so the status bar stays static (green with
# a reverse-highlighted active window, set above). To animate the bar again use
# prefix+C-s (border,status) or prefix+C-e (everything) at runtime.
run-shell -b "~/.local/bin/tmux-pulse-border start -p cool -t border --fps 8"
